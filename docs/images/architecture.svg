  <text x="341" y="623" text-anchor="middle" fill="#6b7280" font-size="7">Leaflet</text>

  <rect x="397" y="592" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="443" y="610" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Tech Rankings</text>
  <text x="443" y="623" text-anchor="middle" fill="#6b7280" font-size="7">AI Scoring</text>

  <rect x="499" y="592" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="545" y="610" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Papers</text>
  <text x="545" y="623" text-anchor="middle" fill="#6b7280" font-size="7">AI Analysis</text>

  <rect x="601" y="592" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="647" y="610" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Patents</text>
  <text x="647" y="623" text-anchor="middle" fill="#6b7280" font-size="7">Deep Read</text>

  <!-- Row 2 modules -->
  <rect x="295" y="642" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="341" y="660" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Investment</text>
  <text x="341" y="673" text-anchor="middle" fill="#6b7280" font-size="7">Advisory</text>

  <rect x="397" y="642" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="443" y="660" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Reports</text>
  <text x="443" y="673" text-anchor="middle" fill="#6b7280" font-size="7">Auto-generated</text>

  <rect x="499" y="642" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="545" y="660" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Agent Panel</text>
  <text x="545" y="673" text-anchor="middle" fill="#6b7280" font-size="7">Live Status</text>

  <rect x="601" y="642" width="92" height="40" rx="6" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="647" y="660" text-anchor="middle" fill="#e8eaed" font-size="8" font-weight="600">Company</text>
  <text x="647" y="673" text-anchor="middle" fill="#6b7280" font-size="7">Detail Pages</text>

  <!-- Users (bottom left) -->
