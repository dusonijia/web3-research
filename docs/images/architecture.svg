  <text x="122" y="103" text-anchor="middle" fill="#00c853" font-size="12" font-weight="700">Data Sources</text>

  <rect x="38" y="115" width="170" height="26" rx="5" fill="#1a2332"/>
  <text x="123" y="133" text-anchor="middle" fill="#ffd600" font-size="10">USPTO / EPO / CNIPA</text>

  <rect x="38" y="148" width="170" height="26" rx="5" fill="#1a2332"/>
  <text x="123" y="166" text-anchor="middle" fill="#ffd600" font-size="10">JPO / KIPO Patents</text>

  <rect x="38" y="181" width="170" height="26" rx="5" fill="#1a2332"/>
  <text x="123" y="199" text-anchor="middle" fill="#00b0ff" font-size="10">Nature / Science / arXiv</text>

  <rect x="38" y="214" width="170" height="26" rx="5" fill="#1a2332"/>
  <text x="123" y="232" text-anchor="middle" fill="#00c853" font-size="10">Reuters / Bloomberg</text>

