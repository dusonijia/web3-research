  <text x="122" y="603" text-anchor="middle" fill="#00c853" font-size="12" font-weight="700">Users</text>
  <rect x="38" y="615" width="170" height="24" rx="5" fill="#1a2332"/>
  <text x="123" y="632" text-anchor="middle" fill="#e8eaed" font-size="9">Desktop Browser</text>
  <rect x="38" y="645" width="170" height="24" rx="5" fill="#1a2332"/>
  <text x="123" y="662" text-anchor="middle" fill="#e8eaed" font-size="9">Mobile Browser</text>

  <!-- Arrow: Users -> Frontend -->
  <line x1="220" y1="630" x2="272" y2="630" stroke="#00c853" stroke-width="2" marker-end="url(#arr)"/>
  <text x="247" y="622" text-anchor="middle" fill="#6b7280" font-size="7">HTTP</text>

  <!-- Flow labels on arrows -->
  <text x="247" y="188" text-anchor="middle" fill="#6b7280" font-size="7">APIs</text>
  <text x="500" y="332" text-anchor="middle" fill="#6b7280" font-size="7">DB Write</text>
  <text x="500" y="542" text-anchor="middle" fill="#6b7280" font-size="7">Serve</text>
  <text x="720" y="158" text-anchor="middle" fill="#6b7280" font-size="7">GPT-4o</text>
  <text x="720" y="426" text-anchor="middle" fill="#6b7280" font-size="7">Deploy</text>

</svg>
