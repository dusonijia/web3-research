  <text x="485" y="211" text-anchor="middle" fill="#6b7280" font-size="8">Weekly / Topic</text>

  <rect x="555" y="175" width="120" height="48" rx="7" fill="url(#gDark)" stroke="#2d3a4f"/>
  <text x="615" y="196" text-anchor="middle" fill="#00b0ff" font-size="10" font-weight="600">Translator</text>
  <text x="615" y="211" text-anchor="middle" fill="#6b7280" font-size="8">CN/EN/JP/KR/DE</text>

