  <text x="490" y="103" text-anchor="middle" fill="#00c853" font-size="12" font-weight="700">AI Agent Cluster (7x24h)</text>

  <!-- Row 1 agents -->
  <rect x="295" y="115" width="120" height="48" rx="7" fill="url(#gDark)" stroke="#2d3a4f"/>
