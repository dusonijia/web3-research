<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Inter,Arial,Helvetica,sans-serif">
  <defs>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#00c853"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#00b0ff"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ab47bc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" rx="16" fill="#0a0f1a"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">GreenPulse System Architecture</text>
  <text x="500" y="56" text-anchor="middle" fill="#6b7280" font-size="11">Global New Energy Intelligence Platform</text>

  <!-- ========== Layer 1: External Data Sources (left) ========== -->
