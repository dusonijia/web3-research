  <text x="425" y="470" text-anchor="middle" fill="#e8eaed" font-size="10" font-weight="600">SQLite / PostgreSQL Database</text>
  <text x="425" y="486" text-anchor="middle" fill="#6b7280" font-size="8">patents / papers / news / reports / agent_logs</text>

